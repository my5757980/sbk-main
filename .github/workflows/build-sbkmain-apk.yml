name: Build SBK website app APK

# Builds the SBK website app (mobile-app/) into a signed-with-debug-key release
# APK on GitHub's runners (the 4 GB build laptop cannot). Re-run by editing this
# file (the path filter below) or from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-sbkmain-apk.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install --no-audit --no-fund

      - name: Expo prebuild (android)
        working-directory: mobile-app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -x lintVitalRelease -x lintVitalReportRelease -x lintVitalAnalyzeRelease

      - name: Collect APK
        run: cp mobile-app/android/app/build/outputs/apk/release/app-release.apk SBK-App.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBK-App-apk
          path: SBK-App.apk

      - name: Publish to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sbk-mainapp-v2.1.7
          name: SBK website app v2.1.7
          files: SBK-App.apk
