  - generic [ref=f14e116]:
    - heading "SBK Services" [level=2] [ref=f14e127]
    - generic [ref=f14e135]:
      - heading "Our Services - End-to-End Vehicle Export Management" [level=2] [ref=f14e137]
      - paragraph [ref=f14e141]: Structured sourcing. Disciplined bidding. Managed logistics. Complete documentation support. Our services bring the entire Japanese vehicle export process under one coordinated system. Each step is handled with clarity, from vehicle selection to final shipment. We work with car dealers, resellers, fleet and rental operators, import-export businesses, bulk buyers, construction companies, taxi services, and individual buyers seeking reliable access to Japan’s vehicle market. When the process demands accuracy and oversight, our services provide the control needed to move forward with confidence.
    - generic [ref=f14e153]:
      - heading "Japanese Vehicle Sourcing" [level=2] [ref=f14e155]
      - heading "Japanese Vehicle Sourcing" [level=2] [ref=f14e157]
      - paragraph [ref=f14e161]: We source vehicles directly from Japanese auctions and trusted dealer networks. You get access to verified listings, clear specifications, and real market value. We shortlist options based on your budget and destination requirements, so you review serious choices, not random inventory.
      - link "View Stock" [ref=f14e163] [cursor=pointer]:
        - /url: https://www.sbkautotrading.com/contact/
    - generic [ref=f14e174]:
      - heading "Auction Bidding and Consultation" [level=2] [ref=f14e176]
      - heading "Auction Bidding and Consultation" [level=2] [ref=f14e178]
      - paragraph [ref=f14e182]: Japanese auctions can be complex. We simplify them. Our team explains auction grades, reviews condition reports, and recommends practical bid ranges. You stay informed at every step and make decisions with clarity, not pressure.
      - link "Start Consultation" [ref=f14e184] [cursor=pointer]:
        - /url: https://www.sbkautotrading.com/contact/
    - generic [ref=f14e201]:
      - heading "Vehicle Inspection and Condition Verification" [level=2] [ref=f14e203]
      - heading "Vehicle Inspection and Condition Verification" [level=2] [ref=f14e205]
      - paragraph [ref=f14e209]: Before any commitment, we carefully review the vehicle’s condition. That includes auction sheet translation, mileage verification, and accident history checks. You receive a clear understanding of what you’re buying before it moves forward.
      - link "Verify Vehicle" [ref=f14e211] [cursor=pointer]:
        - /url: https://www.sbkautotrading.com/contact/
    - generic [ref=f14e222]:
      - heading "Shipping and Logistics Management" [level=2] [ref=f14e224]
      - heading "Shipping and Logistics Management" [level=2] [ref=f14e226]
      - paragraph [ref=f14e230]: We manage shipping from Japan to your destination port with structured coordination. Freight booking, export clearance, and shipment tracking are handled professionally. You receive timely updates while your vehicle moves through each stage.
      - link "Track Shipment" [ref=f14e232] [cursor=pointer]:
        - /url: https://www.sbkautotrading.com/contact/
